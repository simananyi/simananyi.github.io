<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>穴位学习助手 - 内置数据版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* 允许文本选择的元素 */
        .location, .meridian, .status, p, .search-result-text {
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
            user-select: text;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        /* 模块切换按钮 */
        .module-switcher {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
            background: rgba(255,255,255,0.2);
            border-radius: 50px;
            padding: 5px;
            backdrop-filter: blur(10px);
        }

        .module-btn {
            flex: 1;
            padding: 12px 30px;
            background: transparent;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 45px;
            transition: all 0.3s ease;
        }

        .module-btn.active {
            background: white;
            color: #667eea;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
        }

        /* 搜索模块样式 */
        .search-section {
            display: none;
        }

        .search-section.active {
            display: block;
        }

        .search-container {
            max-width: 600px;
            margin: 0 auto;
        }

        .search-input-group {
            position: relative;
            margin-bottom: 30px;
        }

        .search-input {
            width: 100%;
            padding: 15px 50px 15px 20px;
            border: 2px solid #e1e8ed;
            border-radius: 50px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .search-button {
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .search-button:hover {
            transform: translateY(-50%) scale(1.1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .search-type-toggle {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            gap: 10px;
        }

        .search-type-btn {
            padding: 8px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .search-type-btn.active {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border-color: transparent;
        }

        .search-results {
            margin-top: 30px;
        }

        .no-results {
            text-align: center;
            color: #999;
            padding: 40px;
            font-size: 18px;
        }

        .result-item {
            background: linear-gradient(45deg, #f8f9ff, #e8f4f8);
            border: 1px solid #e1e8ed;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
            animation: fadeIn 0.5s ease;
        }

        .result-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .result-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .result-meridian {
            font-size: 0.9em;
            color: #667eea;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .result-location {
            color: #666;
            line-height: 1.6;
        }

        .meridian-acupoints-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .acupoint-tag {
            background: #667eea;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .acupoint-tag:hover {
            background: #5a67d8;
            transform: scale(1.05);
        }

        .acupoint-tag.key-point {
            background: linear-gradient(45deg, #ff6b6b, #ee5a52);
        }

        /* 自测模块（原有样式保持） */
        .study-section {
            display: none;
        }

        .study-section.active {
            display: block;
        }

        .timer {
            text-align: center;
            margin-bottom: 30px;
        }

        .timer-display {
            font-size: 3em;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .timer.warning .timer-display {
            color: #ff6b6b;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .acupoints-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin: 30px 0;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .acupoint-card {
            background: linear-gradient(45deg, #f8f9ff, #e8f4f8);
            border: 2px solid #e1e8ed;
            border-radius: 15px;
            padding: 20px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .acupoint-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }

        .acupoint-name {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            text-align: center;
        }

        .acupoint-details {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e1e8ed;
        }

        .acupoint-details.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .meridian {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 8px;
        }

        .location {
            color: #666;
            line-height: 1.6;
        }

        .controls {
            text-align: center;
            margin: 30px 0;
        }

        .btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 16px;
            margin: 0 10px;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-secondary {
            background: linear-gradient(45deg, #ff6b6b, #ee5a52);
        }

        .status {
            text-align: center;
            margin: 20px 0;
            font-size: 1.1em;
        }

        .settings-section {
            background: #f8f9ff;
            border-radius: 15px;
            padding: 25px;
            margin: 20px 0;
            border: 2px solid #e1e8ed;
        }

        .setting-item {
            margin: 20px 0;
        }

        .setting-label {
            font-size: 1.1em;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            display: block;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .slider {
            flex: 1;
            height: 12px;
            border-radius: 5px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(45deg, #667eea, #764ba2);
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        .slider::-moz-range-thumb {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(45deg, #667eea, #764ba2);
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        .slider-value {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            min-width: 40px;
            text-align: center;
        }

        .key-point-badge {
            background: linear-gradient(45deg, #ff6b6b, #ee5a52);
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            margin-left: 10px;
        }

        .time-inputs {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
        }

        .time-input {
            width: 60px;
            padding: 8px;
            border: 2px solid #667eea;
            border-radius: 8px;
            text-align: center;
            font-size: 16px;
        }

        .time-label {
            color: #666;
            font-size: 14px;
        }

        .meridian-select {
            margin: 20px 0;
        }

        .meridian-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .meridian-item {
            display: flex;
            align-items: center;
            padding: 8px;
            background: #fff;
            border: 1px solid #e1e8ed;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .meridian-item:hover {
            background: #f0f0f0;
        }

        .meridian-checkbox {
            width: 18px;
            height: 18px;
            margin-right: 8px;
            cursor: pointer;
        }

        .meridian-label {
            font-size: 14px;
            cursor: pointer;
            flex: 1;
        }

        .select-all-btn {
            margin: 10px 0;
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
        }

        .select-all-btn:hover {
            background: #5a67d8;
        }

        .data-info {
            background: #e8f4f8;
            border-left: 4px solid #4ecdc4;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            font-size: 14px;
            color: #555;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .module-btn {
                padding: 10px 20px;
                font-size: 14px;
            }
            
            .card {
                padding: 20px;
            }
            
            .timer-display {
                font-size: 2.5em;
            }
            
            .btn {
                padding: 12px 20px;
                font-size: 15px;
                margin: 8px 5px;
            }
            
            .meridian-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
            
            .meridian-acupoints-list {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 10px;
            }
            
            .header h1 {
                font-size: 1.8em;
            }
            
            .card {
                padding: 15px;
            }
            
            .module-switcher {
                flex-direction: column;
                gap: 5px;
            }
            
            .module-btn {
                width: 100%;
            }
            
            .search-input {
                font-size: 14px;
                padding: 12px 45px 12px 15px;
            }
            
            .btn {
                display: block;
                width: 100%;
                max-width: 280px;
                margin: 10px auto;
            }
            
            .meridian-grid {
                grid-template-columns: 1fr;
            }
            
            .meridian-acupoints-list {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            
            .acupoint-tag {
                font-size: 13px;
                padding: 6px 12px;
            }
        }

        /* 返回按钮样式 */
        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background: #5a67d8;
            transform: translateX(-5px);
        }

        .back-button svg {
            width: 16px;
            height: 16px;
        }

        /* 提示信息样式 */
        .tips {
            background: #e8f4f8;
            border-left: 4px solid #4ecdc4;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            font-size: 14px;
            color: #555;
        }

        .tips-title {
            font-weight: bold;
            color: #4ecdc4;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 穴位学习助手</h1>
            <p>搜索查询 · 智能自测 · 高效记忆</p>
        </div>

        <!-- 模块切换 -->
        <div class="module-switcher">
            <button class="module-btn active" onclick="switchModule('search')">🔍 搜索模块</button>
            <button class="module-btn" onclick="switchModule('study')">📖 自测模块</button>
        </div>

        <!-- 搜索模块 -->
        <div class="card search-section active" id="searchSection">
            <div class="search-container">
                <h2 style="text-align: center; margin-bottom: 25px; color: #333;">穴位搜索查询</h2>
                
                <div class="search-type-toggle">
                    <button class="search-type-btn active" onclick="setSearchType('acupoint')">搜索穴位</button>
                    <button class="search-type-btn" onclick="setSearchType('meridian')">搜索经脉</button>
                </div>
                
                <div class="search-input-group">
                    <input type="text" 
                           id="searchInput" 
                           class="search-input" 
                           placeholder="请输入穴位名称..."
                           onkeypress="handleEnterKey(event)">
                    <button class="search-button" onclick="performSearch()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <path d="m21 21-4.35-4.35"></path>
                        </svg>
                    </button>
                </div>
                
                <div class="tips">
                    <div class="tips-title">💡 使用提示：</div>
                    <div id="searchTips">
                        • 输入穴位名称（如"风池"、"太阳"）查看其归经和定位<br>
                        • 支持模糊搜索，输入部分文字即可
                    </div>
                </div>
                
                <div id="searchResults" class="search-results"></div>
            </div>
        </div>

        <!-- 自测模块 -->
        <div class="card study-section" id="studySection">
            <div class="study-content" id="studyContent">
                <div class="data-info">
                    <strong>📚 内置数据信息：</strong><br>
                    总穴位数：<span id="totalPointsCount">--</span> 个<br>
                    重点穴位：<span id="keyPointsCount">--</span> 个<br>
                    普通穴位：<span id="normalPointsCount">--</span> 个<br>
                    经脉数量：<span id="meridiansCount">--</span> 条
                </div>

                <div class="settings-section">
                    <h3 style="text-align: center; margin-bottom: 20px; color: #333;">⚙️ 学习设置</h3>
                    
                    <!-- 总穴位数量设置 -->
                    <div class="setting-item">
                        <label class="setting-label">📍 总穴位数量：</label>
                        <div class="slider-container">
                            <input type="range" id="totalPointSlider" class="slider" min="1" max="10" value="5">
                            <span class="slider-value" id="totalSliderValue">5</span>
                        </div>
                    </div>

                    <!-- 重点穴位数量设置 -->
                    <div class="setting-item">
                        <label class="setting-label">🎯 重点穴位数量（带 * 号）：</label>
                        <div class="slider-container">
                            <input type="range" id="keyPointSlider" class="slider" min="0" max="5" value="3">
                            <span class="slider-value" id="keySliderValue">3</span>
                        </div>
                        <div style="text-align: center; margin-top: 10px; color: #666; font-size: 0.9em;">
                            <span id="sliderDescription">将抽取 3 个重点穴位 + 2 个普通穴位</span>
                        </div>
                    </div>

                    <!-- 倒计时设置 -->
                    <div class="setting-item">
                        <label class="setting-label">⏱️ 倒计时设置：</label>
                        <div class="time-inputs">
                            <input type="number" id="minutesInput" class="time-input" min="0" max="10" value="3">
                            <span class="time-label">分</span>
                            <input type="number" id="secondsInput" class="time-input" min="0" max="59" value="0">
                            <span class="time-label">秒</span>
                        </div>
                        <div style="text-align: center; margin-top: 10px; color: #666; font-size: 0.9em;">
                            最长不超过10分钟
                        </div>
                    </div>

                    <!-- 经脉选择 -->
                    <div class="setting-item meridian-select">
                        <label class="setting-label">🌟 选择经脉（多选）：</label>
                        <button class="select-all-btn" onclick="toggleSelectAll()">全选/取消全选</button>
                        <div class="meridian-grid" id="meridianGrid">
                            <!-- 经脉选项将在这里生成 -->
                        </div>
                    </div>
                </div>

                <div class="timer" id="timer">
                    <h3>⏱️ 倒计时</h3>
                    <div class="timer-display" id="timerDisplay">03:00</div>
                </div>

                <div class="status" id="status">
                    准备开始学习...
                </div>

                <div class="acupoints-grid" id="acupointsGrid">
                    <!-- 穴位卡片将在这里生成 -->
                </div>

                <div class="controls">
                    <button class="btn" id="startBtn" onclick="startStudy()">🎯 开始学习</button>
                    <button class="btn btn-secondary" id="showAnswersBtn" onclick="showAllAnswers()" style="display: none;">
                        👁️ 显示答案
                    </button>
                    <button class="btn" id="newRoundBtn" onclick="newRound()" style="display: none;">
                        🔄 重新开始
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 内置穴位数据
        const ACUPOINT_DATA_TEXT = `
-手太阴肺经
1.	*中府：横平第1肋间隙，锁骨下窝外侧，前正中线旁开6寸
2.	云门：锁骨下窝凹陷中，肩胛骨喙突内缘，前正中线旁开6寸
3.	天府：腋前纹头下3寸，肱二头肌桡侧缘处
4.	侠白：腋前纹头下4寸，肱二头肌桡侧缘处
5.	*尺泽：肘横纹上，肱二头肌腱桡侧缘凹陷中
6.	*孔最：腕掌侧远端横纹上7寸，尺泽与太渊连线上
7.	*列缺：腕掌侧远端横纹上1.5寸，拇短伸肌腱与拇长展肌腱之 间，拇长展肌腱沟的凹陷中
8.	经渠：腕掌侧远端横纹上1寸，桡骨茎突与桡动脉之间
9.	*太渊：桡骨茎突与舟状骨之间，拇长展肌腱尺侧凹陷中
10.	*鱼际：第1掌骨桡侧中点赤白肉际处
11.	*少商：拇指末节桡侧，指甲根角侧上方0.1寸（指寸）

-手阳明大肠经
1.	*商阳：食指末节桡侧，指甲根角侧上方0.1寸（指寸）
2.	二间：第2掌指关节桡侧远端赤白肉际处
3.	*三间：第2掌指关节桡侧近端凹陷中

            // 如果有搜索历史，显示返回按钮
            if (currentHistoryIndex > 0) {
                html += `
                    <button class="back-button" onclick="goBack()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 12H5M5 12L12 19M5 12L12 5"/>
                        </svg>
                        返回
                    </button>
                `;
            }
            
            html += `<h3 style="margin-bottom: 20px;">找到 ${results.length} 个相关穴位：</h3>`;
            
            results.forEach(point => {
                html += `
                    <div class="result-item">
                        <div class="result-title">
                            ${point.name}
                            ${point.isKeyPoint ? '<span class="key-point-badge">★ 重点</span>' : ''}
                        </div>
                        <div class="result-meridian">📍 归经：${point.meridian}</div>
                        <div class="result-location search-result-text">🎯 定位：${point.location}</div>
                    </div>
                `;
            });
            
            searchResults.innerHTML = html;
        }

        // 搜索经脉
        function searchMeridian(searchTerm) {
            const searchResults = document.getElementById('searchResults');
            const matchedMeridians = [];
            
            meridianMap.forEach((points, meridianName) => {
                if (meridianName.includes(searchTerm)) {
                    matchedMeridians.push({ name: meridianName, points: points });
                }
            });
            
            if (matchedMeridians.length === 0) {
                searchResults.innerHTML = '<div class="no-results">未找到相关经脉，请检查输入是否正确</div>';
                return;
            }
            
            let html = '';
            
            // 如果有搜索历史，显示返回按钮
            if (currentHistoryIndex > 0) {
                html += `
                    <button class="back-button" onclick="goBack()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 12H5M5 12L12 19M5 12L12 5"/>
                        </svg>
                        返回
                    </button>
                `;
            }
            
            html += `<h3 style="margin-bottom: 20px;">找到 ${matchedMeridians.length} 条相关经脉：</h3>`;
            
            matchedMeridians.forEach(meridian => {
                html += `
                    <div class="result-item">
                        <div class="result-title">
                            🌟 ${meridian.name}
                            <span style="font-size: 0.8em; color: #666;">（共 ${meridian.points.length} 穴）</span>
                        </div>
                        <div class="meridian-acupoints-list">
                `;
                
                meridian.points.forEach(point => {
                    const className = point.isKeyPoint ? 'acupoint-tag key-point' : 'acupoint-tag';
                    html += `<div class="${className}" onclick="showAcupointDetail('${point.name}')">${point.name}</div>`;
                });
                
                html += `
                        </div>
                    </div>
                `;
            });
            
            searchResults.innerHTML = html;
        }

        // 显示穴位详情
        function showAcupointDetail(acupointName) {
            const searchInput = document.getElementById('searchInput');
            searchInput.value = acupointName;
            
            // 临时切换到穴位搜索类型，但不改变UI
            const prevType = currentSearchType;
            currentSearchType = 'acupoint';
            performSearch(false);
            
            // 恢复之前的搜索类型（用于UI显示）
            // 但实际搜索已经记录在历史中
        }

        // 解析穴位数据
        function parseAcupointData(content) {
            acupointData = [];
            keyPointData = [];
            normalPointData = [];
            meridianMap.clear();
            
            const lines = content.split('\n');
            let currentMeridian = '';
            
            for (let line of lines) {
                line = line.trim();
                if (!line) continue;
                
                // 跳过分隔线
                if (line.match(/^[—\-]+$/)) continue;
                
                // 检查是否是分类标题（以-开头的行）
                if (line.startsWith('-')) {
                    // 去掉开头的横线和末尾的冒号（如果有）
                    currentMeridian = line.substring(1).replace(/[:：]$/, '').trim();
                    if (!meridianMap.has(currentMeridian)) {
                        meridianMap.set(currentMeridian, []);
                    }
                } else if (line.match(/^\d+\./)) {
                    // 解析穴位信息
                    const match = line.match(/^\d+\.\s*(\*?)([^：:]+)[：:](.+)$/);
                    if (match && currentMeridian) {
                        const isKeyPoint = match[1] === '*';
                        const acupoint = {
                            name: match[2].trim(),
                            location: match[3].trim(),
                            meridian: currentMeridian,
                            isKeyPoint: isKeyPoint
                        };
                        
                        acupointData.push(acupoint);
                        meridianMap.get(currentMeridian).push(acupoint);
                        
                        if (isKeyPoint) {
                            keyPointData.push(acupoint);
                        } else {
                            normalPointData.push(acupoint);
                        }
                    }
                }
            }
        }

        // 更新数据信息显示
        function updateDataInfo() {
            document.getElementById('totalPointsCount').textContent = acupointData.length;
            document.getElementById('keyPointsCount').textContent = keyPointData.length;
            document.getElementById('normalPointsCount').textContent = normalPointData.length;
            document.getElementById('meridiansCount').textContent = meridianMap.size;
        }

        // 生成经脉选择框
        function generateMeridianCheckboxes() {
            const meridianGrid = document.getElementById('meridianGrid');
            meridianGrid.innerHTML = '';
            
            meridianMap.forEach((acupoints, meridianName) => {
                const item = document.createElement('div');
                item.className = 'meridian-item';
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.className = 'meridian-checkbox';
                checkbox.id = `meridian-${meridianName}`;
                checkbox.checked = true; // 默认全选
                checkbox.value = meridianName;
                
                const label = document.createElement('label');
                label.className = 'meridian-label';
                label.htmlFor = `meridian-${meridianName}`;
                label.textContent = `${meridianName} (${acupoints.length}穴)`;
                
                item.appendChild(checkbox);
                item.appendChild(label);
                meridianGrid.appendChild(item);
            });
        }

        // 全选/取消全选
        function toggleSelectAll() {
            const checkboxes = document.querySelectorAll('.meridian-checkbox');
            const allChecked = Array.from(checkboxes).every(cb => cb.checked);
            
            checkboxes.forEach(cb => {
                cb.checked = !allChecked;
            });
        }

        // 获取选中的经脉
        function getSelectedMeridians() {
            const checkboxes = document.querySelectorAll('.meridian-checkbox:checked');
            return Array.from(checkboxes).map(cb => cb.value);
        }

        // 更新滑块描述
        function updateSliderDescription() {
            const totalValue = parseInt(document.getElementById('totalPointSlider').value);
            const keyValue = parseInt(document.getElementById('keyPointSlider').value);
            const normalCount = totalValue - keyValue;
            const sliderDescription = document.getElementById('sliderDescription');
            
            if (keyValue === 0) {
                sliderDescription.textContent = `将抽取 ${totalValue} 个普通穴位`;
            } else if (normalCount === 0) {
                sliderDescription.textContent = `将抽取 ${keyValue} 个重点穴位`;
            } else {
                sliderDescription.textContent = `将抽取 ${keyValue} 个重点穴位 + ${normalCount} 个普通穴位`;
            }
        }

        // 开始学习
        function startStudy() {
            // 获取设置
            const totalPointCount = parseInt(document.getElementById('totalPointSlider').value);
            const keyPointCount = parseInt(document.getElementById('keyPointSlider').value);
            const normalPointCount = totalPointCount - keyPointCount;
            const selectedMeridians = getSelectedMeridians();

            if (selectedMeridians.length === 0) {
                alert('请至少选择一条经脉！');
                return;
            }

            // 筛选符合条件的穴位
            const availableKeyPoints = keyPointData.filter(p => selectedMeridians.includes(p.meridian));
            const availableNormalPoints = normalPointData.filter(p => selectedMeridians.includes(p.meridian));

            // 检查穴位数量是否足够
            if (keyPointCount > 0 && availableKeyPoints.length < keyPointCount) {
                alert(`选中经脉的重点穴位数量不足！需要 ${keyPointCount} 个，实际只有 ${availableKeyPoints.length} 个。`);
                return;
            }
            if (normalPointCount > 0 && availableNormalPoints.length < normalPointCount) {
                alert(`选中经脉的普通穴位数量不足！需要 ${normalPointCount} 个，实际只有 ${availableNormalPoints.length} 个。`);
                return;
            }

            currentAcupoints = [];

            // 随机选择重点穴位
            if (keyPointCount > 0) {
                const selectedKeyPoints = [];
                const usedKeyIndices = new Set();
                while (selectedKeyPoints.length < keyPointCount) {
                    const randomIndex = Math.floor(Math.random() * availableKeyPoints.length);
                    if (!usedKeyIndices.has(randomIndex)) {
                        usedKeyIndices.add(randomIndex);
                        selectedKeyPoints.push(availableKeyPoints[randomIndex]);
                    }
                }
                currentAcupoints.push(...selectedKeyPoints);
            }

            // 随机选择普通穴位
            if (normalPointCount > 0) {
                const selectedNormalPoints = [];
                const usedNormalIndices = new Set();
                while (selectedNormalPoints.length < normalPointCount) {
                    const randomIndex = Math.floor(Math.random() * availableNormalPoints.length);
                    if (!usedNormalIndices.has(randomIndex)) {
                        usedNormalIndices.add(randomIndex);
                        selectedNormalPoints.push(availableNormalPoints[randomIndex]);
                    }
                }
                currentAcupoints.push(...selectedNormalPoints);
            }

            // 打乱顺序
            for (let i = currentAcupoints.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentAcupoints[i], currentAcupoints[j]] = [currentAcupoints[j], currentAcupoints[i]];
            }

            displayAcupoints();
            startTimer();
            
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('showAnswersBtn').style.display = 'inline-block';
            
            const pointInfo = keyPointCount > 0 && normalPointCount > 0 
                ? `（${keyPointCount} 个重点穴位，${normalPointCount} 个普通穴位）`
                : keyPointCount > 0 
                    ? `（${keyPointCount} 个重点穴位）`
                    : `（${normalPointCount} 个普通穴位）`;
            
            updateStatus(`🤔 请回忆这些穴位的归经和定位...${pointInfo}`);
        }

        // 显示穴位
        function displayAcupoints() {
            const grid = document.getElementById('acupointsGrid');
            grid.innerHTML = '';
            
            currentAcupoints.forEach((acupoint, index) => {
                const card = document.createElement('div');
                card.className = 'acupoint-card';
                card.innerHTML = `
                    <div class="acupoint-name">
                        ${acupoint.name}
                        ${acupoint.isKeyPoint ? '<span class="key-point-badge">★ 重点</span>' : ''}
                    </div>
                    <div class="acupoint-details" id="details-${index}">
                        <div class="meridian">📍 归经：${acupoint.meridian}</div>
                        <div class="location">🎯 定位：${acupoint.location}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 开始计时器
        function startTimer() {
            // 获取设置的时间
            const minutes = parseInt(document.getElementById('minutesInput').value) || 0;
            const seconds = parseInt(document.getElementById('secondsInput').value) || 0;
            timeLeft = minutes * 60 + seconds;
            
            if (timeLeft === 0) {
                timeLeft = 180; // 默认3分钟
            }
            
            isTimerRunning = true;
            updateTimerDisplay();
            
            timer = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                
                // 最后30秒警告效果
                if (timeLeft <= 30) {
                    document.getElementById('timer').classList.add('warning');
                }
                
                if (timeLeft <= 0) {
                    timeUp();
                }
            }, 1000);
        }

        // 更新计时器显示
        function updateTimerDisplay() {
            let displayTime = timeLeft;
            if (!isTimerRunning) {
                const minutes = parseInt(document.getElementById('minutesInput').value) || 0;
                const seconds = parseInt(document.getElementById('secondsInput').value) || 0;
                displayTime = minutes * 60 + seconds;
                if (displayTime === 0) displayTime = 180;
            }
            
            const minutes = Math.floor(displayTime / 60);
            const seconds = displayTime % 60;
            const display = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            document.getElementById('timerDisplay').textContent = display;
        }

        // 时间到
        function timeUp() {
            clearInterval(timer);
            isTimerRunning = false;
            showAllAnswers();
            updateStatus('⏰ 时间到！答案已显示');
            
            document.getElementById('timer').classList.remove('warning');
            document.getElementById('showAnswersBtn').style.display = 'none';
            document.getElementById('newRoundBtn').style.display = 'inline-block';
        }

        // 显示所有答案
        function showAllAnswers() {
            currentAcupoints.forEach((_, index) => {
                const details = document.getElementById(`details-${index}`);
                details.classList.add('show');
            });
            
            if (isTimerRunning) {
                clearInterval(timer);
                isTimerRunning = false;
                updateStatus('👁️ 答案已显示，继续巩固记忆吧！');
                document.getElementById('timer').classList.remove('warning');
            }
            
            document.getElementById('showAnswersBtn').style.display = 'none';
            document.getElementById('newRoundBtn').style.display = 'inline-block';
        }

        // 新一轮学习
        function newRound() {
            document.getElementById('startBtn').style.display = 'inline-block';
            document.getElementById('showAnswersBtn').style.display = 'none';
            document.getElementById('newRoundBtn').style.display = 'none';
            
            document.getElementById('acupointsGrid').innerHTML = '';
            updateTimerDisplay();
            document.getElementById('timer').classList.remove('warning');
            
            updateStatus('🎯 准备开始新一轮学习...');
        }

        // 更新状态信息
        function updateStatus(message) {
            document.getElementById('status').textContent = message;
        }
    </script>
</body>
</html>
